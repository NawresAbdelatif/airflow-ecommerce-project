services:

  postgres:
    image: postgres:13
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - ecommerce-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: "no"


  mongodb:
    image: mongo:7.0
    container_name: ecommerce-mongodb
    ports:
      - "27019:27017"
    volumes:
      - ecommerce-mongo-data:/data/db
    restart: "no"


  airflow-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow

    image: ecommerce-airflow:2.10.5
    container_name: ecommerce-airflow-init

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./reports:/opt/airflow/reports
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com || true &&
      airflow connections delete fs_default || true &&
      airflow connections add fs_default
      --conn-type fs
      --conn-extra '{\"path\": \"/opt/airflow/data\"}'
      "


  airflow-webserver:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow

    image: ecommerce-airflow:2.10.5
    container_name: ecommerce-airflow-webserver

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth

      AIRFLOW__WEBSERVER__WORKERS: "1"
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "300"
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: "300"


    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./reports:/opt/airflow/reports
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins

    ports:
      - "8083:8080"

    command: webserver
    restart: "no"


  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow

    image: ecommerce-airflow:2.10.5
    container_name: ecommerce-airflow-scheduler

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./reports:/opt/airflow/reports
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins

    command: scheduler
    restart: "no"


  jenkins:
    build:
      context: .
      dockerfile: docker/Dockerfile.jenkins

    container_name: ecommerce-jenkins

    ports:
      - "8084:8080"
      - "50000:50000"

    volumes:
      - ecommerce-jenkins-home:/var/jenkins_home
      - ./:/project

    restart: "no"


volumes:
  ecommerce-postgres-data:
  ecommerce-mongo-data:
  ecommerce-jenkins-home:

